<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Receips — אפליקציית מתכונים</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#f7a8b8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Maites" />
<link rel="apple-touch-icon" href="/maites-icon.png?v=2" />
<link rel="icon" type="image/png" href="/maites-icon.png?v=2" />

<!-- Fonts: Rubik (display) + Heebo (body), self-hosted so the app looks
     the same with no network. -->
<link rel="stylesheet" href="/vendor/fonts/fonts.css">

<link rel="stylesheet" href="/theme.css">

<!-- React + Babel — bundled locally: the app must boot with no network.
     Production React builds; Babel compiles the .jsx files in the browser. -->
<script src="/vendor/capacitor.js"></script>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/babel.min.js"></script>

<!-- Capture beforeinstallprompt early, before React loads -->
<script>
  window.__deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window.__deferredInstall = e;
  });
</script>
<script src="/vendor/firebase-app-compat.js"></script>
<script src="/vendor/firebase-firestore-compat.js"></script>
<script src="/vendor/firebase-auth-compat.js"></script>
<script src="image-slot.js"></script>
<!-- SheetJS (xlsx) is loaded on demand by exporter.jsx, not at startup. -->
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="errors.jsx"></script>
  <script type="text/babel" src="native.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="forms.jsx"></script>
  <script type="text/babel" src="exporter.jsx"></script>
  <script type="text/babel" src="db.jsx"></script>
  <script type="text/babel" src="guest.jsx"></script>
  <script type="text/babel" src="backup.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="cooking.jsx"></script>
  <script type="text/babel" src="book.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <!-- A blank screen is never an acceptable answer: if the app has not
       mounted a few seconds after load, say what happened and offer a way out. -->
  <div id="boot-fallback" hidden>
    <div style="max-width:320px">
      <div class="bf-emoji">🍳</div>
      <h1>Maites לא הצליחה לעלות</h1>
      <p id="boot-reason">נראה שחלק מהקבצים לא נטענו.</p>
      <button type="button" onclick="location.reload()">נסו שוב</button>
    </div>
  </div>

  <script>
    (function () {
      // Watchdog — React mounts into #root; if nothing is there, show the
      // fallback instead of an empty page.
      var t = setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var reason = document.getElementById('boot-reason');
          if (reason && !navigator.onLine) {
            reason.textContent = 'אין חיבור לאינטרנט, והאפליקציה עוד לא נשמרה במכשיר. התחברי לרשת פעם אחת וזה יעבוד גם בלי חיבור.';
          }
          document.getElementById('boot-fallback').hidden = false;
        }
      }, 9000);
      window.addEventListener('maites-ready', function () { clearTimeout(t); });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            // Look for a newer version on every launch, so a deploy reaches
            // the phone on the next open rather than days later.
            if (navigator.onLine) reg.update().catch(function () {});
            // Ask the worker to keep the Excel / PDF engines around too.
            var warm = function () {
              if (navigator.serviceWorker.controller && navigator.onLine) {
                navigator.serviceWorker.controller.postMessage('warm-optional');
              }
            };
            setTimeout(warm, 4000);
            reg.addEventListener('updatefound', function () {
              var sw = reg.installing;
              if (!sw) return;
              sw.addEventListener('statechange', function () {
                // A new version is ready; it takes over on the next launch.
                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                  window.__maitesUpdateReady = true;
                }
              });
            });
          }).catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
