<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Receips — אפליקציית מתכונים</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#f7a8b8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Maites" />

<link rel="icon" type="image/png" href="/maites-icon.png?v=2" />

<!-- Fonts: Quicksand display + Heebo for Hebrew -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Heebo:wght@300;400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ═══════════════════════════════════════════════════════════
     Design tokens. Everything visual in the app reads from here:
     one place to change a colour, a spacing step or a radius.
     Three theme states are supported — explicit light, explicit
     dark, and "follow the system" (no data-theme attribute).
     ═══════════════════════════════════════════════════════════ */
  :root{
    color-scheme: light;

    /* ── surfaces & ink ───────────────────────────── */
    --bg: #fbeef2;                     /* page ground behind cards */
    --bg-grad-1: #ffe5d3;
    --bg-grad-2: #e0d3f5;
    --bg-grad-3: #f5e7ef;
    --bg-grad-4: #efe1ec;
    --surface: #fff7e8;                /* sheets, panels */
    --surface-raised: #ffffff;         /* inputs, floating chips */
    --surface-sunken: rgba(0,0,0,.045);
    --glass: rgba(255,255,255,.85);    /* frosted controls */
    --glass-strong: rgba(255,255,255,.94);
    --overlay: rgba(28,22,32,.55);     /* behind modals */
    --line: rgba(0,0,0,.08);
    --line-strong: rgba(0,0,0,.16);

    --ink: #2c1d27;
    --ink-soft: #5b4452;
    --ink-faint: #8a7280;
    --sheen: rgba(255,255,255,.35);   /* gloss on coloured cards */
    --on-brand: #ffffff;               /* text on --brand-strong */

    /* ── meaning: identity vs. state ──────────────── */
    --brand: #f7a8b8;                  /* identity only */
    --brand-strong: #e34466;           /* active nav, primary action, ♥ */
    --danger: #c62f2f;                 /* destructive only */
    --danger-soft: rgba(198,47,47,.12);
    --success: #2c8a52;
    --success-soft: rgba(44,138,82,.14);
    --warning: #b5790d;

    /* ── recipe palettes (themed) ─────────────────── */
    --p-yellow-bg:#ffd255; --p-yellow-bg2:#fff1c2; --p-yellow-ink:#3a2a0a; --p-yellow-tag:#ffefb8; --p-yellow-accent:#a8730e;
    --p-sky-bg:#8fd6e7;    --p-sky-bg2:#dbf3f8;    --p-sky-ink:#0f3641;    --p-sky-tag:#cdedf3;    --p-sky-accent:#186c7e;
    --p-pink-bg:#f7a8b8;   --p-pink-bg2:#ffe2e8;   --p-pink-ink:#3a1622;   --p-pink-tag:#ffd2db;   --p-pink-accent:#a83d52;
    --p-mint-bg:#9adfb1;   --p-mint-bg2:#dff3e6;   --p-mint-ink:#0e3b25;   --p-mint-tag:#c8ecd4;   --p-mint-accent:#26794a;
    --p-lavender-bg:#c9b8e8;--p-lavender-bg2:#e9e0f8;--p-lavender-ink:#2a1e4a;--p-lavender-tag:#dccdf3;--p-lavender-accent:#61489a;
    --p-peach-bg:#ffb494;  --p-peach-bg2:#ffdfcd;  --p-peach-ink:#3d1a0a;  --p-peach-tag:#ffd2bd;  --p-peach-accent:#b34c24;

    /* ── spacing scale ────────────────────────────── */
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 18px;
    --sp-5: 26px; --sp-6: 38px; --sp-7: 56px;

    /* ── radii, by role ───────────────────────────── */
    --r-sm: 10px;    /* chips, small controls */
    --r-md: 18px;    /* inputs, inner blocks */
    --r-lg: 28px;    /* cards, sheets */
    --r-pill: 999px;
    --radius-card: var(--r-lg);

    /* ── elevation: three levels, no more ─────────── */
    --e1: 0 2px 8px -2px rgba(64,33,50,.16);
    --e2: 0 10px 28px -8px rgba(64,33,50,.25), 0 1px 0 rgba(255,255,255,.55) inset;
    --e3: 0 22px 50px -10px rgba(64,33,50,.34), 0 40px 80px -28px rgba(64,33,50,.24);
    --shadow-card: var(--e2);
    --shadow-card-lift: var(--e3);

    /* ── type scale ───────────────────────────────── */
    --t-display: 30px;   /* screen title */
    --t-title: 24px;     /* card title, sheet title */
    --t-heading: 19px;   /* section heading */
    --t-body: 16px;      /* running text */
    --t-small: 14px;     /* secondary text */
    --t-caption: 12.5px; /* captions, counters */
    --t-label: 11px;     /* uppercase eyebrows */
    --lh-tight: 1.2;
    --lh-body: 1.6;

    --font-display: 'Rubik', 'Quicksand', 'Heebo', system-ui, sans-serif;
    --font-body: 'Heebo', 'Rubik', system-ui, sans-serif;

    /* ── motion ───────────────────────────────────── */
    --dur-fast: .18s;
    --dur: .25s;
    --dur-slow: .4s;
    --ease-out: cubic-bezier(.2,.9,.25,1.1);
  }

  /* Dark theme — applied when the system asks for it and the user
     has not pinned light, and again when the user pins dark. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #191218;
      --bg-grad-1: #3a2233;
      --bg-grad-2: #241d3d;
      --bg-grad-3: #1d151c;
      --bg-grad-4: #150f14;
      --surface: #241b21;
      --surface-raised: #2f242c;
      --surface-sunken: rgba(255,255,255,.06);
      --glass: rgba(47,36,44,.86);
      --glass-strong: rgba(52,40,49,.95);
      --overlay: rgba(8,5,9,.66);
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(255,255,255,.2);

      --ink: #f6ecf1;
      --ink-soft: #c6b0bd;
      --ink-faint: #9b8592;
      --sheen: rgba(255,255,255,.09);
      --on-brand: #ffffff;

      --brand: #f7a8b8;
      --brand-strong: #e8536f;
      --danger: #f07070;
      --danger-soft: rgba(240,112,112,.16);
      --success: #6ecb95;
      --success-soft: rgba(110,203,149,.16);
      --warning: #e0ab3c;

      --p-yellow-bg:#6d5411; --p-yellow-bg2:#3e2f09; --p-yellow-ink:#ffeab0; --p-yellow-tag:#4f3d0d; --p-yellow-accent:#ffd255;
      --p-sky-bg:#15525f;    --p-sky-bg2:#0d3742;    --p-sky-ink:#cdeff7;    --p-sky-tag:#123f4b;    --p-sky-accent:#8fd6e7;
      --p-pink-bg:#7c3040;   --p-pink-bg2:#4d1f28;   --p-pink-ink:#ffd7de;   --p-pink-tag:#5c2531;   --p-pink-accent:#f7a8b8;
      --p-mint-bg:#205e3a;   --p-mint-bg2:#143d26;   --p-mint-ink:#cdf0d9;   --p-mint-tag:#1a4c2f;   --p-mint-accent:#9adfb1;
      --p-lavender-bg:#4b3b74;--p-lavender-bg2:#31264c;--p-lavender-ink:#e0d5f5;--p-lavender-tag:#3b2e5c;--p-lavender-accent:#c9b8e8;
      --p-peach-bg:#7c3b1f;  --p-peach-bg2:#4f2513;  --p-peach-ink:#ffd9c4;  --p-peach-tag:#5e2d17;  --p-peach-accent:#ffb494;

      --e1: 0 2px 8px -2px rgba(0,0,0,.5);
      --e2: 0 10px 28px -8px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06) inset;
      --e3: 0 22px 50px -10px rgba(0,0,0,.7), 0 40px 80px -28px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #191218;
    --bg-grad-1: #3a2233;
    --bg-grad-2: #241d3d;
    --bg-grad-3: #1d151c;
    --bg-grad-4: #150f14;
    --surface: #241b21;
    --surface-raised: #2f242c;
    --surface-sunken: rgba(255,255,255,.06);
    --glass: rgba(47,36,44,.86);
    --glass-strong: rgba(52,40,49,.95);
    --overlay: rgba(8,5,9,.66);
    --line: rgba(255,255,255,.10);
    --line-strong: rgba(255,255,255,.2);

    --ink: #f6ecf1;
    --ink-soft: #c6b0bd;
    --ink-faint: #9b8592;
    --sheen: rgba(255,255,255,.09);
    --on-brand: #ffffff;

    --brand: #f7a8b8;
    --brand-strong: #e8536f;
    --danger: #f07070;
    --danger-soft: rgba(240,112,112,.16);
    --success: #6ecb95;
    --success-soft: rgba(110,203,149,.16);
    --warning: #e0ab3c;

    --p-yellow-bg:#6d5411; --p-yellow-bg2:#3e2f09; --p-yellow-ink:#ffeab0; --p-yellow-tag:#4f3d0d; --p-yellow-accent:#ffd255;
    --p-sky-bg:#15525f;    --p-sky-bg2:#0d3742;    --p-sky-ink:#cdeff7;    --p-sky-tag:#123f4b;    --p-sky-accent:#8fd6e7;
    --p-pink-bg:#7c3040;   --p-pink-bg2:#4d1f28;   --p-pink-ink:#ffd7de;   --p-pink-tag:#5c2531;   --p-pink-accent:#f7a8b8;
    --p-mint-bg:#205e3a;   --p-mint-bg2:#143d26;   --p-mint-ink:#cdf0d9;   --p-mint-tag:#1a4c2f;   --p-mint-accent:#9adfb1;
    --p-lavender-bg:#4b3b74;--p-lavender-bg2:#31264c;--p-lavender-ink:#e0d5f5;--p-lavender-tag:#3b2e5c;--p-lavender-accent:#c9b8e8;
    --p-peach-bg:#7c3b1f;  --p-peach-bg2:#4f2513;  --p-peach-ink:#ffd9c4;  --p-peach-tag:#5e2d17;  --p-peach-accent:#ffb494;

    --e1: 0 2px 8px -2px rgba(0,0,0,.5);
    --e2: 0 10px 28px -8px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06) inset;
    --e3: 0 22px 50px -10px rgba(0,0,0,.7), 0 40px 80px -28px rgba(0,0,0,.5);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, a, [role="button"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body{
    margin: 0; padding: 0; min-height: 100vh;
    font-family: var(--font-body);
    font-size: var(--t-body);
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 20% 0%, var(--bg-grad-1) 0%, transparent 60%),
      radial-gradient(1100px 700px at 80% 100%, var(--bg-grad-2) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-grad-3) 0%, var(--bg-grad-4) 100%);
    overflow: hidden;
  }
  body{ display: block; }

  /* hide scrollbars inside the phone */
  .scroll-y{ overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }
  .scroll-y::-webkit-scrollbar{ display: none; }

  /* utility */
  .display{ font-family: var(--font-display); letter-spacing: -.01em; }
  .stack{ display: flex; flex-direction: column; }
  button{ font-family: inherit; color: inherit; }

  /* Keyboard focus is always visible; pointer focus never draws a ring. */
  :focus{ outline: none; }
  :focus-visible{
    outline: 3px solid var(--brand-strong);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  /* Respect the OS "reduce motion" setting: transitions collapse, the
     app still changes state, nothing animates across the screen. */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Recipe-book printing: pages are portalled outside #root and only the
     print root is visible on paper. Printed pages are always on paper —
     they keep the light palette regardless of the app theme. */
  .print-root{ display: none; }
  /* PDF stage: laid out at full A4 width so it can be rasterised, parked
     off-screen so nobody ever sees it. */
  .pdf-stage{
    position: fixed; top: 0; inset-inline-start: -20000px;
    width: 794px; z-index: -1; pointer-events: none;
    background: #fff;
  }
  @media print{
    html, body{
      overflow: visible !important; height: auto !important;
      background: #fff !important; display: block !important;
    }
    body > #root{ display: none !important; }
    .print-root{ display: block !important; }
    .book-page{
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
      box-shadow: none !important; margin: 0 !important;
    }
    .book-page:last-child{ page-break-after: auto !important; break-after: auto !important; }
    @page{ size: A4; margin: 0; }
  }
  @keyframes delPop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Capture beforeinstallprompt early, before React loads -->
<script>
  window.__deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window.__deferredInstall = e;
  });
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="image-slot.js"></script>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="errors.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>

  <script type="text/babel" src="cooking.jsx"></script>
  <script type="text/babel" src="book.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {

      });
    }

</body>
</html>
